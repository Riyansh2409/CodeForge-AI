[project]
name = "codeforge-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RIYANSH JAIN", email = "theriyanshjain1@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-google-genai>=4.3.4",
    "langchain-openai>=1.5.1",
    "langsmith>=0.11.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
codeforge-ai = "codeforge_ai:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
